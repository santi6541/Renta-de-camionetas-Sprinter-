{% extends "base.html" %}
{% block title %}{{ 'Editar' if unidad else 'Nueva' }} unidad · Renta Sprinter{% endblock %}
{% block content %}
<section class="panel">
  <h1>{{ 'Editar unidad' if unidad else 'Registrar unidad' }}</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-grid">
      <div><label for="codigo">Código</label><input id="codigo" name="codigo" required maxlength="20" value="{{ unidad.codigo if unidad else '' }}"></div>
      <div><label for="marca">Marca</label><input id="marca" name="marca" required value="{{ unidad.marca if unidad else 'Mercedes-Benz' }}"></div>
      <div><label for="modelo">Modelo</label><input id="modelo" name="modelo" required value="{{ unidad.modelo if unidad else 'Sprinter' }}"></div>
      <div><label for="anio">Año</label><input id="anio" name="anio" type="number" min="1990" required value="{{ unidad.anio if unidad else '' }}"></div>
      <div><label for="placas">Placas</label><input id="placas" name="placas" required maxlength="20" value="{{ unidad.placas if unidad else '' }}"></div>
      <div><label for="capacidad_pasajeros">Capacidad de pasajeros</label><input id="capacidad_pasajeros" name="capacidad_pasajeros" type="number" min="1" required value="{{ unidad.capacidad_pasajeros if unidad else '' }}"></div>
      <div><label for="precio_dia">Precio por día</label><input id="precio_dia" name="precio_dia" type="number" min="0.01" step="0.01" required value="{{ unidad.precio_dia if unidad else '' }}"></div>
      <div><label for="fecha_compra">Fecha de compra</label><input id="fecha_compra" name="fecha_compra" type="date" value="{{ unidad.fecha_compra.isoformat() if unidad and unidad.fecha_compra else '' }}"></div>
      <div><label for="kilometraje">Kilometraje</label><input id="kilometraje" name="kilometraje" type="number" min="0" value="{{ unidad.kilometraje if unidad else 0 }}"></div>
      <div><label for="estatus">Estado</label><select id="estatus" name="estatus">{% for status in statuses %}<option value="{{ status }}" {{ 'selected' if unidad and unidad.estatus == status or not unidad and status == 'disponible' }}>{{ status|replace('_', ' ')|title }}</option>{% endfor %}</select></div>
    </div>
    <p class="actions"><button type="submit">Guardar</button><a class="button secondary" href="{{ url_for('unidades.index') }}">Cancelar</a></p>
  </form>
</section>
{% endblock %}
