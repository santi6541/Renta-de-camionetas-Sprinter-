{% extends "base.html" %}
{% block title %}{{ 'Editar' if cliente else 'Nuevo' }} cliente · Renta Sprinter{% endblock %}
{% block content %}
<section class="panel">
  <h1>{{ 'Editar cliente' if cliente else 'Registrar cliente' }}</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-grid">
      <div><label for="nombre">Nombre</label><input id="nombre" name="nombre" required maxlength="100" value="{{ cliente.nombre if cliente else '' }}"></div>
      <div><label for="telefono">Teléfono</label><input id="telefono" name="telefono" required maxlength="20" value="{{ cliente.telefono if cliente else '' }}"></div>
      <div><label for="email">Correo</label><input id="email" name="email" type="email" required maxlength="150" value="{{ cliente.email if cliente else '' }}"></div>
      <div><label for="rfc">RFC</label><input id="rfc" name="rfc" maxlength="13" value="{{ cliente.rfc if cliente and cliente.rfc else '' }}"></div>
      <div><label for="tipo_cliente">Tipo</label><select id="tipo_cliente" name="tipo_cliente"><option value="particular" {{ 'selected' if not cliente or cliente.tipo_cliente == 'particular' }}>Particular</option><option value="empresa" {{ 'selected' if cliente and cliente.tipo_cliente == 'empresa' }}>Empresa</option></select></div>
    </div>
    <p class="actions"><button type="submit">Guardar</button><a class="button secondary" href="{{ url_for('clientes.index') }}">Cancelar</a></p>
  </form>
</section>
{% endblock %}
